<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; background: #F4EFE6; }
  body { position: relative; }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.14; mix-blend-mode: multiply;
  }
  .sheet {
    position: absolute; inset: 32px;
    border: 1px solid rgba(28, 25, 21, 0.55);
    pointer-events: none;
  }
  svg.arch { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .lockup {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: translateY(6px);
  }
  .name {
    margin: 0;
    font-family: "Liberation Serif", "Times New Roman", Times, serif;
    font-weight: 400;
    font-size: 146px;
    line-height: 0.82;
    letter-spacing: 0.16em;
    color: #1C1915;
  }
  .rule {
    width: 156px; height: 2px; background: #0F5E56;
    margin: 22px 0 14px;
  }
  .place {
    margin: 0;
    font-family: "Liberation Sans", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 0.46em;
    color: #0F5E56;
    padding-left: 0.46em;
  }
  .foot {
    position: absolute; left: 64px; right: 64px; bottom: 44px;
    display: flex; justify-content: space-between;
    font-family: "Liberation Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #1C1915;
  }
  .foot span { padding-left: 0.2em; }
</style>
</head>
<body>
  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="n">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
  <svg class="arch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
    <g stroke="#1C1915" stroke-width="1.4" stroke-linecap="square">
      <line x1="72" y1="100" x2="250" y2="100"/>
      <line x1="950" y1="100" x2="1128" y2="100"/>
      <line x1="72" y1="122" x2="1128" y2="122"/>
      <line x1="72" y1="136" x2="1128" y2="136"/>
      <line x1="72" y1="492" x2="1128" y2="492"/>
      <line x1="96" y1="136" x2="96" y2="492"/>
      <line x1="114" y1="136" x2="114" y2="492"/>
      <line x1="178" y1="136" x2="178" y2="492"/>
      <line x1="196" y1="136" x2="196" y2="492"/>
      <line x1="1004" y1="136" x2="1004" y2="492"/>
      <line x1="1022" y1="136" x2="1022" y2="492"/>
      <line x1="1086" y1="136" x2="1086" y2="492"/>
      <line x1="1104" y1="136" x2="1104" y2="492"/>
      <line x1="84" y1="136" x2="126" y2="136" stroke-width="2.4"/>
      <line x1="166" y1="136" x2="208" y2="136" stroke-width="2.4"/>
      <line x1="992" y1="136" x2="1034" y2="136" stroke-width="2.4"/>
      <line x1="1074" y1="136" x2="1116" y2="136" stroke-width="2.4"/>
      <line x1="82" y1="492" x2="128" y2="492" stroke-width="2.4"/>
      <line x1="164" y1="492" x2="210" y2="492" stroke-width="2.4"/>
      <line x1="990" y1="492" x2="1036" y2="492" stroke-width="2.4"/>
      <line x1="1072" y1="492" x2="1118" y2="492" stroke-width="2.4"/>
      <line x1="105" y1="64" x2="105" y2="112"/>
      <line x1="187" y1="64" x2="187" y2="112"/>
      <line x1="1013" y1="64" x2="1013" y2="112"/>
      <line x1="1095" y1="64" x2="1095" y2="112"/>
      <rect x="1040" y="236" width="30" height="150"/>
      <line x1="1055" y1="236" x2="1055" y2="386"/>
    </g>
    <rect x="126" y="236" width="40" height="150" fill="#0F5E56"/>
    <rect x="72" y="492" width="1056" height="3" fill="#0F5E56"/>
  </svg>
  <div class="sheet"></div>
  <div class="lockup">
    <p class="name">DANIEL</p>
    <p class="name">NIGATU</p>
    <div class="rule"></div>
    <p class="place">ADDIS ABABA</p>
  </div>
  <div class="foot">
    <span>ARCHITECTURAL VISUALIZATION</span>
    <span>INTERIORS · IDENTITY</span>
  </div>
</body>
</html>
