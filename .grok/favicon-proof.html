<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body { margin: 0; background: #fff; }
  .row { display: flex; gap: 24px; align-items: end; padding: 24px; }
  img { display: block; background: #ccc; }
  .s16 { width: 16px; height: 16px; image-rendering: pixelated; }
  .s16x { width: 128px; height: 128px; image-rendering: pixelated; }
  .s32 { width: 32px; height: 32px; }
  .s64 { width: 64px; height: 64px; }
</style>
</head>
<body>
  <div class="row">
    <img class="s16" src="favicon.svg"/>
    <img class="s16x" src="favicon.svg"/>
    <img class="s32" src="favicon.svg"/>
    <img class="s64" src="favicon.svg"/>
  </div>
</body>
</html>
